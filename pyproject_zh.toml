[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "mjlab-microduck"
version = "0.1.0"
description = "RL training environments for the Microduck robot, built on mjlab"
readme = "README.md"
license = "Apache-2.0 AND CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "LICENSE-MODELS.md"]
# <3.13：bam (better-actuator-models) 把 requires-python 固定在 <3.13，且 jobs 必须
# 使用与本地测试相同的解释器（3.12）——浮动的上界曾让 HF jobs 选中 3.13.14（2026-07-21）。
requires-python = ">=3.12, <3.13"
dependencies = [
    "mjlab==1.3.0",
    "warp-lang==1.12.0",
    # BAM 的发行包名是 `better-actuator-models`；import 名仍是 `bam`。
    "better-actuator-models",
    "onnxruntime>=1.24.4",
    "rustypot>=1.4.2",
    "huggingface_hub>=0.27.0",
    "matplotlib>=3.10.9",
    # mjlab 1.3.0 会 import scipy（terrains/heightfield_terrains.py）却忘了声明它——
    # 没有这一行，全新环境的 `uv sync`（例如 HF jobs 上）连 `import mjlab_microduck`
    # 都做不到（2026-07-21 发现）。
    "scipy>=1.16",
    # 设为直接依赖（Direct dep）只是为了让 [tool.uv.sources] 能在 aarch64 上把 torch
    # 绑定到 CUDA index（见下方 torch source）——uv 只对直接依赖应用 source，如果它
    # 只是传递依赖（来自 mjlab、rsl_rl），source 条目会被静默忽略。
    # 固定为 uv.lock 已从 PyPI 解析出的精确版本，这样在 aarch64 上只改变 wheel 的
    # 来源（SOURCE），不改变版本：浮动的 `>=` 会让 CUDA index（带有比 PyPI pin 更新的
    # 构建）把 torch 2.9.1 -> 2.13.0，这是对 mjlab/rsl_rl 未经检验的升级。
    "torch==2.9.1",
    "mujoco>=3.10.0",
    "trimesh>=4.11.1",
    "fast-simplification>=0.2.0",
]

[project.entry-points."mjlab.tasks"]
mjlab_microduck = "mjlab_microduck.tasks"

[project.scripts]
# 这个名称故意与 mjlab 的 `train` 冲突，必须保留声明。
# 同名 console script 是后写入者生效（last-writer-wins），两个 dist-info 的 RECORD
# 都会声明 bin/train，因此删掉这一行并不会把名字还给 mjlab：`uv sync` 会卸载该文件
# （按我们的 RECORD，它是我们的），而没有任何东西去重建 mjlab 的那份，导致 venv 里
# 根本没有 `train` —— `uv run train` 于是会找到 PATH 上某个无关的 `train`
# （liblinear 的，2026-08-31）。
# 这个冲突无害，因为两个 shim 可以互换：`--hf-jobs` 是从上面的 `mjlab.tasks`
# entry point（train_hook.py）拦截的，而不是在这里。由 tests/test_hf_jobs_flag.py 锁定。
train = "mjlab_microduck.train_cli:main"
# 向真实的 `robotd` 提供一个模拟 body —— 见 sim/body_server.py。
duck-body = "mjlab_microduck.sim.body_server:main"
publish = "mjlab_microduck.publish.cli:main"
share-training = "mjlab_microduck.publish.training:main"
[tool.ruff]
src = ["src"]  # 有助于识别第一方（first-party）import。
indent-width = 4
exclude = [
  "src/mjlab/third_party",
  "typings",
]

[tool.uv]
override-dependencies = [
    # 注意：不要 override mujoco —— mjlab 1.3.0 的 mujoco-warp 固定了兼容的
    # mujoco（3.10.x）；此前这里的 override 曾把 mujoco 强制降到 3.4.0，而该版本
    # 缺少 mujoco-warp 3.8.1 所 import 的 mjDSBL_MULTICCD → import 崩溃。
    # bam 固定了 protobuf<4.0（用于它的 zmq/dynamixel 通信，我们并不使用——
    # 我们只 import bam.model/bam.actuator）。没有这个 override，降级会级联地把
    # onnx 压到 1.17.0，而该版本没有 wheel，从源码构建会失败。
    "protobuf>=4.0,<7.0",
    # 把 onnx 保持在有预编译 wheel 的版本上（1.17.0 没有 py3.13 的 wheel，
    # 从源码构建会失败）。否则引入 bam 会把它往下压。
    "onnx>=1.20.1",
    # bam 依赖 PyPI 上的占位包 `zmq==0.0.0`，其预编译 wheel 是无效的
    # （缺少 .dist-info）→ 在全新安装（例如 HF Jobs 的远程构建）时 `uv sync` 会失败，
    # 尽管本地“热”缓存能容忍它。我们只用 bam.mjlab（不用 zmq/erob 通信），
    # 所以通过一个恒为假的 marker 把 zmq 去掉。
    "zmq ; python_version < '3.0'",
]

[tool.uv.sources]
# mjlab 现在来自 PyPI（==1.3.0，固定在 [project.dependencies] 中）；不再使用 git source。
# 官方 BAM actuator 模型。等面向 mjlab 的 API 合入 `main`（或某个 tag）后切换过去。
better-actuator-models = { git = "https://github.com/Rhoban/bam.git", branch = "mjlab_frictionloss" }
# 本地开发 BAM 时，注释掉上面那行，改用：
# better-actuator-models = { path = "/home/antoine/Rhoban/bam", editable = true }
# 在 linux-aarch64（DGX Spark / GB10）上，PyPI 的 torch wheel 只有 CPU 版：
# torch.__version__ == "2.9.1+cpu"，torch.version.cuda 是 None，因此
# torch.cuda.device_count() == 0，mjlab 的 select_gpus() 会索引一个空列表 →
# 在训练开始前就 `IndexError: list index out of range`（mjlab/utils/gpu.py:70）。
# 在那里把 torch 导向 PyTorch 的 CUDA index。
# 选 cu129（而不是 cu130）以匹配 warp 1.12.0 自带的 CUDA toolkit，这样
# warp<->torch 的 zero-copy 互操作保持在同一个运行时大版本上。
# 该 marker 让 x86_64（HF Jobs）继续走 PyPI，那里的 wheel 已通过 nvidia-*-cu12
# 依赖自带 CUDA —— 这一解析结果不变。
torch = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
# explicit：只有明确指定该 index 的包才会从它解析。
explicit = true

# [[tool.uv.index]]
# url="https://pypi.tuna.tsinghua.edu.cn/simple"
# default=true
